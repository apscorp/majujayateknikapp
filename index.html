<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maju Jaya Teknik - Sistem Operasional</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">Maju Jaya Teknik Web App</span>
    </div>
  </nav>

  <div class="container mb-5">
    <!-- PANEL ABSENSI TEKNISI -->
    <div class="card mb-4 shadow-sm">
      <div class="card-header bg-white font-weight-bold">Form Absensi Harian</div>
      <div class="card-body">
        <form id="formAbsensi">
          <div class="mb-3">
            <label class="form-label">Nama Teknisi</label>
            <select class="form-select" id="namaTeknisi" required>
              <option value="">-- Pilih Teknisi --</option>
              <option value="TEK-01 (Andri)">TEK-01 (Andri)</option>
              <option value="TEK-02 (Budi)">TEK-02 (Budi)</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Tipe Absen</label>
            <select class="form-select" id="tipeAbsen" required>
              <option value="Masuk">Masuk</option>
              <option value="Keluar">Keluar</option>
            </select>
          </div>
          <button type="button" class="btn btn-success w-100" onclick="submitAbsen()">Kirim Absen (GPS)</button>
        </form>
      </div>
    </div>

    <!-- PANEL TIME TRACKER SPK TEKNISI -->
    <div class="card shadow-sm">
      <div class="card-header bg-white font-weight-bold">Tracking Waktu SPK Lapangan</div>
      <div class="card-body">
        <div class="mb-3">
          <label class="form-label">ID SPK Pekerjaan</label>
          <input type="text" class="form-control" id="inputIDSPK" placeholder="Contoh: SPK-1001">
        </div>
        <div class="d-grid gap-2">
          <button class="btn btn-warning" onclick="updateStatusSPK('Jalan Ke Lokasi')">🚗 1. Mulai Perjalanan</button>
          <button class="btn btn-info text-white" onclick="updateStatusSPK('Tiba Di Lokasi')">📍 2. Tiba di Lokasi</button>
          <button class="btn btn-primary" onclick="updateStatusSPK('Sedang Dikerjakan')">🛠️ 3. Mulai Pengerjaan</button>
          <button class="btn btn-success" onclick="updateStatusSPK('Selesai')">✅ 4. Selesai Pengerjaan</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
